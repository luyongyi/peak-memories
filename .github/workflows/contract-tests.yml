name: Contract tests

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  contracts:
    name: ${{ matrix.os }} / ${{ matrix.project }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-latest
          - windows-latest
        project:
          - ReplayContract
          - NativeAppearanceContract
          - CratePlaybackContract
          - ItemPlaybackContract
          - NativeLoadingContract
          - ReplayViewContract
          - ReplayNameplateContract
          - ReplayAudioSpatialContract
          - TrajectoryContract
          - TrajectoryUploadContract
          - StaticPlaybackContract
          - NativeSpiderIdleLineContract
          - ActorNetworkContract
          - AudioSceneEventContract
          - AudioClipMetadataContract
          - EffectEventCaptureContract
          - SceneItemCadenceContract
          - FrogTongueSamplingContract
          - CreatureSamplingCadenceContract
          - NativeParameterCadenceContract
          - ReplaySceneBudgetContract
          - AutomaticFullRunStartContract
        include:
          - os: windows-latest
            project: NativeCreatureObserverContract
          - os: windows-latest
            project: NativeItemObserverContract
          - os: windows-latest
            project: CreatureIdleAnimationContract
          - os: windows-latest
            project: NativeCreatureQuietContract
          - os: windows-latest
            project: RavenAnimationContract
          - os: windows-latest
            project: EarlyWormAnimationContract
          - os: windows-latest
            project: FrogCaptureContract
          - os: windows-latest
            project: NativePlacementActivityContract
          - os: windows-latest
            project: NativeSegmentScopeContract
          - os: windows-latest
            project: EnvironmentSegmentScopeContract
          - os: windows-latest
            project: NativeSpawnOriginContract
          - os: windows-latest
            project: NativeItemCaptureContract
          - os: windows-latest
            project: NativeCaptureBootstrapContract
          - os: windows-latest
            project: NativeEffectForcesContract
          - os: windows-latest
            project: EffectCheckpointContract
          - os: windows-latest
            project: NativeAudioPoolContract
          - os: windows-latest
            project: AudioSeekPreparationContract
          - os: windows-latest
            project: NativeStaticEventContract
    env:
      DOTNET_CLI_TELEMETRY_OPTOUT: "1"
      DOTNET_NOLOGO: "true"
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-dotnet@v6
        with:
          # global.json selects SDK 10; net8.0 test executables need runtime 8.
          dotnet-version: |
            8.0.x
            10.0.x
      - name: Build contract project
        run: dotnet build "tests/${{ matrix.project }}/${{ matrix.project }}.csproj" -c Release
      - name: Run contracts
        run: dotnet run --project "tests/${{ matrix.project }}/${{ matrix.project }}.csproj" -c Release --no-build

  release-tool:
    name: ${{ matrix.os }} / Release verifier
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-latest
          - windows-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: |
            8.0.x
            10.0.x
      - name: Build release verifier
        run: dotnet build tools/ReleaseVerifier/ReleaseVerifier.csproj -c Release --nologo -warnaserror
      - name: Test release package rejection cases
        run: dotnet run --project tools/ReleaseVerifier/ReleaseVerifier.csproj -c Release --no-build -- self-test
